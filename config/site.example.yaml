# 复制为 site.yaml 后在现场填写。所有 __REQUIRED_ON_SITE__ 都必须替换。
# 不要把 AccessKey、密码或 STS Token 写入本文件；这里只写环境变量名。
schemaVersion: "0.1.1"
projectCode: "kjky20250400"
envCode: "__REQUIRED_ON_SITE__"
batchId: "__REQUIRED_ON_SITE__"
caseId: "__REQUIRED_ON_SITE__"
timezone: "Asia/Shanghai"

collector:
  collectorId: "__REQUIRED_ON_SITE__"
  siteId: "__REQUIRED_ON_SITE__"
  collectorType: "ALIYUN"

runtime:
  # 开发阶段使用 DEVELOPMENT；生产配置改为 PRODUCTION 并关闭 rawPersistence。
  deploymentMode: "DEVELOPMENT"
  windowSeconds: 600
  requestTimeoutSeconds: 30
  maxRetries: 3
  retryBaseMillis: 500
  # 云 API 查询重试：有上限指数退避，并在上下 20% 范围内加入随机抖动。
  retryMaxDelayMillis: 30000
  retryJitterRatio: 0.2
  maxPollAttempts: 10
  pollIntervalMillis: 1000

# 每个任务窗口的分页硬上限；达到上限但尚未完整结束时失败，不推进水位。
pagination:
  maxPages: 1000
  maxRecords: 1000000

# daemon 命令使用的数据源周期轮询配置。runtime.pollIntervalMillis 仅用于
# 单次 SLS 查询尚未完成时的状态轮询，两者含义不同。
scheduler:
  jitterSeconds: 3
  shutdownGraceSeconds: 60
  # 补偿调度将在稳定 event_id 去重完成后启用；本阶段先冻结参数。
  compensationIntervalSeconds: 600
  compensationLookbackSeconds: 1800
  arms:
    pollIntervalSeconds: 30
    visibilityDelaySeconds: 90
    initialLookbackSeconds: 300
  sls:
    pollIntervalSeconds: 20
    visibilityDelaySeconds: 30
    initialLookbackSeconds: 120

# BatchUploader 已接入 daemon 独立上传循环；启用上传后 ingestUrl 必填。
upload:
  enabled: false
  ingestUrl: null
  maxRecords: 1000
  maxCompressedBytes: 2097152
  maxRequestBytes: 10485760
  maxWaitMillis: 5000
  maxInFlightBatches: 2
  connectTimeoutSeconds: 10
  requestTimeoutSeconds: 30
  retryInitialDelayMillis: 1000
  retryMaxDelayMillis: 60000
  retryJitterRatio: 0.2
  retryWarningAttempts: 10

# mTLS 支持 PEM 和 KEYSTORE 两种客户端身份模式，密码只写环境变量名。
security:
  mtlsEnabled: false
  clientAuthMode: "KEYSTORE"
  clientCertificatePath: null
  privateKeyPath: null
  keyStorePath: null
  keyStoreType: "PKCS12"
  keyStorePasswordEnv: null
  trustStorePath: null
  trustStoreType: "PKCS12"
  trustStorePasswordEnv: null
  certificateExpiryWarningDays: 30
  certificateReloadIntervalSeconds: 30

storage:
  dataRoot: "./data-package"
  outboxDir: "outbox"
  stateDir: "state"
  rawPersistence:
    # 生产模式必须为 false；当前 Outbox 未完成前，关闭后会安全拒绝采集。
    enabled: true
    directory: "raw"
  diskWarningWatermarkPercent: 80
  diskCriticalWatermarkPercent: 90
  diskResumeWatermarkPercent: 75
  diskCheckIntervalSeconds: 10
  outboxQuota:
    # 远程策略首次成功生效前使用 defaultBytes；生产值按现场 PVC 容量评估。
    defaultBytes: 10737418240
    minBytes: 1073741824
    maxBytes: 21474836480
    reservedFreeBytes: 1073741824
    warningPercent: 80
    criticalPercent: 90
    resumePercent: 75
    checkIntervalSeconds: 10

# 中控任务领取和心跳将在控制功能阶段启用。
control:
  enabled: false
  taskClaimUrl: null
  jobStatusUrl: null
  statusReportUrl: null # 启用 control 时填写 /collector/v1/status 完整 URL
  heartbeatIntervalSeconds: 30
  statusChangeMinIntervalMillis: 1000 # 连续变化合并限频，默认最多每秒补发一次
  taskPollIntervalSeconds: 7
  taskPollJitterSeconds: 2
  connectTimeoutSeconds: 10
  requestTimeoutSeconds: 30
  retryInitialDelayMillis: 1000
  retryMaxDelayMillis: 30000
  retryJitterRatio: 0.2

arms:
  enabled: true
  # RPC：AccessKey 签名 API；DATASET：文档中的 Dataset 表单查询接口。
  mode: "RPC"
  endpoint: "__REQUIRED_ON_SITE__"
  protocol: "HTTP"
  regionId: "__REQUIRED_ON_SITE__"
  product: "ARMS"
  version: "__REQUIRED_ON_SITE__"
  accessKeyIdEnv: "ARMS_ACCESS_KEY_ID"
  accessKeySecretEnv: "ARMS_ACCESS_KEY_SECRET"
  pageSize: 100
  collectTraceDetails: true
  traceQueries:
    - name: "all-traces"
      # 使用现有命名规范中的 record_type，不在程序中固定枚举。
      recordType: "topology_edge"
      pid: "__REQUIRED_ON_SITE__"
      serviceName: null
      operationName: null
      traceId: null
      minDuration: null
      maxDuration: null
      # 现场文档出现额外查询参数时在此透传。
      parameters: {}
      # 自定义响应字段仅按现场文档配置 JSON Pointer；null 使用保守信封字段识别。
      pagination:
        totalPointer: null
        positionPointer: null
        hasMorePointer: null
        truncatedPointer: null
        nextCursorPointer: null
      normalization:
        # 留空时使用内置 ARMS Trace 安全字段；现场确认后可显式收紧。
        payloadFields: []
        identityFields: ["TraceID"]
  metricQueries:
    - name: "service-metric"
      recordType: "flow_feature"
      # QueryMetricByPage 分页协议尚未确认，当前配置校验禁止启用。
      action: "QueryMetric"
      metric: "__REQUIRED_ON_SITE__"
      measures: ["__REQUIRED_ON_SITE__"]
      dimensions: []
      customFilters: []
      # 文档存在“最小 60000”与示例“60”的口径差异，现场先用短查询确认单位。
      interval: 60
      limit: 10000
      # 常用过滤条件；具体格式须用现场接口探测确认。
      filters:
        pid: "__REQUIRED_ON_SITE__"
        regionId: "__REQUIRED_ON_SITE__"
      # 常规数组会按 RPC 规范编码为 Measures.1、Filters.1.Key/Value 等；
      # 如 Apsara Stack 版本有额外字段，可在这里直接补充。
      parameters: {}
      normalization:
        # 建议把 measures、dimensions 以及事件时间字段明确列入准入清单。
        payloadFields: ["timestamp", "value", "metric", "dimensions"]
        identityFields: []
  dataset:
    url: "__REQUIRED_ON_SITE__"
    usernameEnv: "ARMS_DATASET_USERNAME"
    passwordEnv: "ARMS_DATASET_PASSWORD"
    queries: []

sls:
  enabled: true
  endpoint: "__REQUIRED_ON_SITE__"
  accessKeyIdEnv: "SLS_ACCESS_KEY_ID"
  accessKeySecretEnv: "SLS_ACCESS_KEY_SECRET"
  # 不使用 STS 时不设置这个环境变量即可。
  stsTokenEnv: "SLS_STS_TOKEN"
  projects:
    - project: "__REQUIRED_ON_SITE__"
      logstores:
        - logstore: "__REQUIRED_ON_SITE__"
          recordType: "flow_record"
          topic: ""
          query: ""
          pageSize: 100
          reverse: false
          normalization:
            # SLS 字段由现场定义；生产前必须按数据分级要求调整准入字段。
            payloadFields: ["message", "method", "path", "status", "duration", "trace_id", "service_id"]
            identityFields: ["request_id"]
