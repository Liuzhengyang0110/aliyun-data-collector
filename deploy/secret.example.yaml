# 示例文件不得直接用于生产。请在安全环境中创建同名 Secret，勿提交真实值。
apiVersion: v1
kind: Secret
metadata:
  name: aliyun-data-collector-credentials
  namespace: aliyun-collector-system
type: Opaque
stringData:
  ARMS_ACCESS_KEY_ID: "REPLACE_WITH_SECRET_VALUE"
  ARMS_ACCESS_KEY_SECRET: "REPLACE_WITH_SECRET_VALUE"
  SLS_ACCESS_KEY_ID: "REPLACE_WITH_SECRET_VALUE"
  SLS_ACCESS_KEY_SECRET: "REPLACE_WITH_SECRET_VALUE"
  SLS_STS_TOKEN: "REPLACE_IF_STS_IS_USED"
  COLLECTOR_KEYSTORE_PASSWORD: "REPLACE_WITH_SECRET_VALUE"
  COLLECTOR_TRUSTSTORE_PASSWORD: "REPLACE_WITH_SECRET_VALUE"
---
# PKCS12/JKS 是二进制文件；生产中应使用 --from-file 创建，不要把内容写入 YAML。
apiVersion: v1
kind: Secret
metadata:
  name: aliyun-data-collector-tls
  namespace: aliyun-collector-system
type: Opaque
stringData:
  client.p12: "REPLACE_WITH_BINARY_FILE_USING_KUBECTL_FROM_FILE"
  truststore.p12: "REPLACE_WITH_BINARY_FILE_USING_KUBECTL_FROM_FILE"
